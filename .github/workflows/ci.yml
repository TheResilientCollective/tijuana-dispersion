name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: ruff format check
        run: uv run ruff format --check .

      - name: ruff lint
        run: uv run ruff check .

      - name: mypy strict
        run: uv run mypy --strict tijuana_dispersion

      - name: detect-secrets baseline
        run: uv run detect-secrets scan --baseline .secrets.baseline 2>/dev/null || true

      - name: detect-secrets audit
        run: |
          uv run detect-secrets-hook \
            --baseline .secrets.baseline \
            $(git ls-files | grep -v '^.secrets.baseline$') || \
            (echo "::error::Possible secret detected. Audit .secrets.baseline." && exit 1)

      - name: No-synthetic-data check
        run: |
          # Look for suspicious patterns outside tests/. The grep below is intentionally
          # broad — it surfaces candidates for human review, not automatic failures, EXCEPT
          # for the most obvious violations (np.random in package code).
          if grep -rEn 'np\.random\.|numpy\.random\.|random\.(random|randint|randn|choice)' \
              tijuana_dispersion/ 2>/dev/null | \
              grep -v '# random ok:'; then
            echo "::error::np.random usage in package code without '# random ok: <reason>' annotation"
            exit 1
          fi

      - name: pytest with coverage
        run: |
          # Global coverage is a soft floor (40%); per-module floor (80% on
          # core.py + schemas.py) is enforced in the next step per AGENTS.md.
          uv run pytest \
            --cov=tijuana_dispersion \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=40

      - name: Per-module coverage floor (core, schemas)
        run: |
          # core.py and schemas.py have a stricter 80% floor enforced individually.
          # Filenames in coverage.xml are relative to [tool.coverage.run] source,
          # which is "tijuana_dispersion" — so the keys are bare (e.g. "core.py").
          uv run python scripts/check_coverage.py \
            --module core.py --min 80 \
            --module schemas.py --min 80

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push on PR; push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tijuana-dispersion:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-railway:
    runs-on: ubuntu-latest
    needs: [lint-and-test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Skip deploy if no Railway token
        id: check_token
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "::warning::RAILWAY_TOKEN not set; skipping deploy"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Install Railway CLI
        if: steps.check_token.outputs.skip == 'false'
        run: |
          curl -fsSL https://railway.com/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH
      - name: Deploy
        if: steps.check_token.outputs.skip == 'false'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --detach
